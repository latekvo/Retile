<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retile</title>
<style>
:root {
  --pad: 28px;
  /* One key unit. The keyboard is 18u × 5.6u (14.5u main block + 0.5u gap + 3u arrows); the height term keeps short screens scroll-free. */
  --u: min(calc((min(1180px, 94vw) - 2 * var(--pad)) / 18), calc((100vh - 300px) / 5.6));
  --gap: calc(var(--u) * 0.07);

  --dim: rgba(0, 0, 0, 0.26);
  --panel: rgb(242, 242, 245);
  --edge: rgba(0, 0, 0, 0.12);
  --shadow: rgba(0, 0, 0, 0.28);
  --rule: rgba(0, 0, 0, 0.08);
  --text: #1d1d1f;
  --muted: rgba(0, 0, 0, 0.5);
  --cap: #fff;
  --cap-edge: rgba(0, 0, 0, 0.1);
  --cap-text: rgba(0, 0, 0, 0.3);
  --tint: 24%;
  --tint-hot: 42%;
  --tip: #fff;
  --desk: rgba(0, 0, 0, 0.07);
  --win: #fff;
  --win-edge: rgba(0, 0, 0, 0.2);
  --win-bar: rgba(0, 0, 0, 0.07);
  --alert: rgba(0, 0, 0, 0.72);

  /* move/workspace/focus share the arrow keys, so they get the three hues that stay distinct under colour blindness. */
  --g-move: #2a78d6;
  --g-workspace: #eb6834;
  --g-focus: #1baf7a;
  --g-layout: #6250d6;
  --g-app: #e87ba4;
  --g-external: #eda100;
  --g-other: #898781;
}
@media (prefers-color-scheme: dark) {
  :root {
    --dim: rgba(0, 0, 0, 0.42);
    --panel: rgb(30, 30, 33);
    --edge: rgba(255, 255, 255, 0.13);
    --shadow: rgba(0, 0, 0, 0.55);
    --rule: rgba(255, 255, 255, 0.08);
    --text: rgba(255, 255, 255, 0.93);
    --muted: rgba(255, 255, 255, 0.5);
    --cap: rgba(255, 255, 255, 0.065);
    --cap-edge: rgba(255, 255, 255, 0.05);
    --cap-text: rgba(255, 255, 255, 0.3);
    --tint: 30%;
    --tint-hot: 52%;
    --tip: #2c2c30;
    --desk: rgba(255, 255, 255, 0.06);
    --win: #4a4a50;
    --win-edge: rgba(255, 255, 255, 0.14);
    --win-bar: rgba(255, 255, 255, 0.08);

    --g-move: #3987e5;
    --g-workspace: #d95926;
    --g-focus: #199e70;
    --g-layout: #9085e9;
    --g-app: #d55181;
    --g-external: #c98500;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: transparent; }
body {
  display: grid;
  place-items: center;
  font: 13px/1.35 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
  cursor: default;
}
body::before { content: ""; position: fixed; inset: 0; background: var(--dim); }

#panel {
  position: relative;
  width: calc(var(--u) * 18 + 2 * var(--pad));
  padding: 20px var(--pad) 16px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  background: var(--panel);
  border-radius: 18px;
  box-shadow: 0 0 0 0.5px var(--edge), 0 24px 80px var(--shadow);
  animation: pop 0.16s ease-out;
}
@keyframes pop { from { opacity: 0; transform: scale(0.985); } }

header { display: flex; align-items: baseline; gap: 10px; }
h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
#subtitle { color: var(--muted); }
#subtitle:empty { display: none; }

#kb { position: relative; width: calc(var(--u) * 18); }
.key {
  position: absolute;
  left: calc(var(--x) * var(--u) + var(--gap) / 2);
  top: calc(var(--y) * var(--u) + var(--gap) / 2);
  width: calc(var(--w) * var(--u) - var(--gap));
  height: calc(var(--h) * var(--u) - var(--gap));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: calc(var(--u) * 0.11);
  background: var(--cap);
  box-shadow: inset 0 0 0 0.5px var(--cap-edge), 0 0.5px 1px var(--cap-edge);
  color: var(--cap-text);
  line-height: 1.15;
}
.leg { font-size: calc(var(--u) * 0.25); }
.word .leg { font-size: calc(var(--u) * 0.165); }
.short .leg { font-size: calc(var(--u) * 0.15); }
.glyph { font-size: calc(var(--u) * 0.21); }
.name { font-size: calc(var(--u) * 0.13); }

.key.bound {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  align-items: stretch;
  color: var(--text);
}
.seg {
  --mix: var(--tint);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: calc(var(--u) * 0.03);
  background: color-mix(in srgb, var(--c) var(--mix), transparent);
  box-shadow: inset 0 calc(var(--u) * -0.045) 0 var(--c);
}
/* A border, not a gap, so the divider belongs to a segment and is no hover dead zone. */
.seg + .seg { border-left: 1.5px solid var(--panel); }
.seg:hover { --mix: var(--tint-hot); }
.word .seg { padding: 0 calc(var(--u) * 0.05); }
.seg .mods, .seg .leg { width: 100%; text-align: center; white-space: nowrap; overflow: hidden; }
.mods { font-size: calc(var(--u) * 0.19); letter-spacing: -0.08em; opacity: 0.85; }
.short .mods { font-size: calc(var(--u) * 0.15); }
.mods.none { opacity: 0.5; }
/* Too many segments to fit modifiers side by side: they wrap, and four lines plus the legend fit 1u. */
.stack .seg { justify-content: flex-end; padding-bottom: calc(var(--u) * 0.08); }
.stack .mods { font-size: calc(var(--u) * 0.15); line-height: 1; letter-spacing: 0; white-space: normal; word-break: break-all; }
.stack:not(.word) .leg { font-size: calc(var(--u) * 0.2); line-height: 1; }

.key.lit {
  background: color-mix(in srgb, var(--lit) var(--tint-hot), transparent);
  box-shadow: inset 0 0 0 1.5px var(--lit);
  color: var(--text);
}

#other { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.other-label, footer { color: var(--muted); font-size: 12px; }
.other-label { margin-right: 4px; }
.chip {
  padding: 3px 9px 4px;
  border-radius: 6px;
  font-size: 12.5px;
  background: color-mix(in srgb, var(--c) var(--tint), transparent);
  box-shadow: inset 0 -2px 0 var(--c);
}
.chip:hover { background: color-mix(in srgb, var(--c) var(--tint-hot), transparent); }

footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--rule);
}
#legend { display: flex; flex-wrap: wrap; gap: 6px 16px; list-style: none; }
#legend li { display: flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
footer p { white-space: nowrap; }

#tip {
  position: fixed;
  left: 0;
  top: 0;
  z-index: 1;
  max-width: 320px;
  padding: 8px 12px 9px;
  border-radius: 10px;
  background: var(--tip);
  box-shadow: 0 0 0 0.5px var(--edge), 0 10px 30px var(--shadow);
  pointer-events: none;
  opacity: 0;
}
#tip.on { opacity: 1; transition: opacity 0.1s; }
#tip-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 2px 14px; }
#tip-chord { font-size: 15px; font-weight: 600; white-space: nowrap; }
#tip-group { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); white-space: nowrap; }
#tip-group::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
#tip-group:empty { display: none; }
#tip-desc { margin-top: 2px; }

/* Preview: a scale model of the screen acting out the key. */
#tip-preview { margin-top: 9px; }
.stage { position: relative; margin: 0 auto; overflow: hidden; border-radius: 5px; }
.world { position: absolute; inset: 0; }
.desk, .win, .ring, .tint, .lift { position: absolute; }
.desk { background: var(--desk); border-radius: 4px; }
.win {
  overflow: hidden;
  border-radius: 2.5px;
  background: var(--win);
  box-shadow: 0 0 0 0.5px var(--win-edge);
}
.win::before { content: ""; position: absolute; inset: 0 0 auto; height: min(6px, 22%); background: var(--win-bar); }
.win.focused { background: color-mix(in srgb, var(--c) 22%, var(--win)); }
.tint { inset: 0; background: var(--c); }
.lift { inset: 0; border-radius: inherit; box-shadow: 0 3px 10px var(--shadow); }
.ring { border-radius: 3.5px; box-shadow: 0 0 0 1.5px var(--c); z-index: 9; }
.minimap { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; background: var(--dim); }
.minikeys {
  display: grid;
  grid-template-columns: repeat(11, 1fr);
  gap: 2px;
  width: 58%;
  padding: 5px;
  border-radius: 5px;
  background: var(--panel);
  box-shadow: 0 0 0 0.5px var(--edge), 0 4px 14px var(--shadow);
}
.minikeys i { height: 7px; border-radius: 1.5px; background: var(--cap); box-shadow: inset 0 0 0 0.5px var(--cap-edge); }
.minikeys i:nth-child(7n + 3) { background: color-mix(in srgb, var(--c) 45%, var(--cap)); }
.label, .badge, .tag { position: absolute; z-index: 11; white-space: nowrap; font-size: 11px; }
.label { left: 50%; bottom: 10%; transform: translateX(-50%); padding: 3px 9px; border-radius: 7px; background: var(--alert); color: #fff; }
.badge { top: 6px; right: 6px; padding: 1px 6px; border-radius: 5px; background: var(--alert); color: #fff; }
.tag { top: 6px; left: 6px; padding: 0 5px; border-radius: 4px; background: var(--tip); color: var(--muted); font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; }
.dots { position: relative; display: flex; gap: 5px; width: fit-content; height: 6px; margin: 7px auto 0; }
.dot { width: 6px; height: 6px; border-radius: 3px; background: var(--muted); opacity: 0.5; }
.dot.other { background: none; box-shadow: inset 0 0 0 1px var(--muted); }
.dot.here { position: absolute; left: 0; width: 14px; background: var(--c); opacity: 1; }
#tip-note { margin-top: 6px; color: var(--muted); font-size: 12px; }
#tip-note:empty { display: none; }
</style>
</head>
<body>
<main id="panel">
  <header><h1 id="title"></h1><span id="subtitle"></span></header>
  <div id="kb"></div>
  <footer><ul id="legend"></ul><p>Hover a key to see what it does · Esc to close</p></footer>
</main>
<div id="tip" role="tooltip"><div id="tip-head"><span id="tip-chord"></span><span id="tip-group"></span></div><div id="tip-desc"></div><div id="tip-preview"></div><div id="tip-note"></div></div>
<script>window.RETILE = __RETILE_DATA__;</script>
<script>
"use strict";
const R = window.RETILE;
const $ = (id) => document.getElementById(id);
const panel = $("panel"), kb = $("kb"), tip = $("tip");

const GLYPH = { ctrl: "⌃", alt: "⌥", shift: "⇧", cmd: "⌘" };
const ORDER = Object.keys(GLYPH);
const MOD_NAME = { ctrl: "control", alt: "option", shift: "shift", cmd: "command" };
const GROUPS = new Set(["move", "workspace", "focus", "layout", "app", "external"]);
const NAMES = {
  escape: "esc", left: "←", right: "→", up: "↑", down: "↓",
  pageup: "Page Up", pagedown: "Page Down", home: "Home", end: "End", forwarddelete: "Forward Delete", help: "Help",
};
const keyName = (k) =>
  NAMES[k] || (/^f\d+$/.test(k) ? k.toUpperCase() : k.startsWith("pad") ? "Keypad " + k.slice(3) : k.length === 1 && k.toUpperCase().length === 1 ? k.toUpperCase() : k);
const modText = (b) => b.mods.map((m) => GLYPH[m]).join("");
const chord = (b) => (b.mods.length ? modText(b) + " " : "") + keyName(b.key);
const color = (g) => `var(--g-${GROUPS.has(g) ? g : "other"})`;
const groupLabel = new Map(R.groups.map((g) => [g.id, g.label]));

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

// --- layout: x/y/w/h in key units -------------------------------------------
const key = (id, w = 1) => ({ id, w, label: keyName(id) });
const mod = (m, w) => ({ mod: m, w, label: "" });
const blank = (w, label = "") => ({ w, label });
const chars = (s) => [...s].map((c) => key(c));
const ROWS = [
  [0.6, [key("escape", 1.5), ...Array.from({ length: 12 }, (_, i) => key("f" + (i + 1))), blank(1)]],
  [1, [...chars("`1234567890-="), key("delete", 1.5)]],
  [1, [key("tab", 1.5), ...chars("qwertyuiop[]\\")]],
  [1, [blank(1.75, "caps lock"), ...chars("asdfghjkl;'"), key("return", 1.75)]],
  [1, [mod("shift", 2.25), ...chars("zxcvbnm,./"), mod("shift", 2.25)]],
  [1, [blank(1, "fn"), mod("ctrl", 1.25), mod("alt", 1.25), mod("cmd", 1.5), key("space", 5.5), mod("cmd", 1.5), mod("alt", 1.25), mod("ctrl", 1.25)]],
];
const caps = [];
let height = 0;
for (const [h, row] of ROWS) {
  let x = 0;
  for (const c of row) { caps.push({ ...c, x, y: height, h }); x += c.w; }
  height += h;
}
const shiftRow = height - 2;
caps.push(
  { ...key("up"), x: 16, y: shiftRow, h: 1 },
  { ...key("left"), x: 15, y: shiftRow + 1, h: 1 },
  { ...key("down"), x: 16, y: shiftRow + 1, h: 1 },
  { ...key("right"), x: 17, y: shiftRow + 1, h: 1 },
);
kb.style.height = `calc(var(--u) * ${height})`;

// --- binds --------------------------------------------------------------------
const rank = (b) => b.mods.map((m) => ORDER.indexOf(m));
function byMods(a, b) {
  const x = rank(a), y = rank(b);
  if (x.length !== y.length) return x.length - y.length;
  const i = x.findIndex((v, j) => v !== y[j]);
  return i < 0 ? 0 : x[i] - y[i];
}
const bindsByKey = new Map();
R.binds.forEach((b, i) => {
  b.i = i;
  if (!bindsByKey.has(b.key)) bindsByKey.set(b.key, []);
  bindsByKey.get(b.key).push(b);
});
for (const list of bindsByKey.values()) list.sort(byMods);

// --- render -------------------------------------------------------------------
$("title").textContent = R.title;
$("subtitle").textContent = R.subtitle;

for (const c of caps) {
  const k = el("div", "key");
  k.style.cssText = `--x:${c.x};--y:${c.y};--w:${c.w};--h:${c.h}`;
  if (c.h < 1) k.classList.add("short");
  if ([...c.label].length > 1) k.classList.add("word");
  const binds = bindsByKey.get(c.id);
  if (binds) {
    k.classList.add("bound");
    for (const b of binds) {
      const s = el("div", "seg");
      s.dataset.b = b.i;
      s.style.setProperty("--c", color(b.group));
      s.append(el("span", b.mods.length ? "mods" : "mods none", modText(b) || "–"), el("span", "leg", c.label));
      k.append(s);
    }
  } else if (c.mod) {
    k.dataset.mod = c.mod;
    k.append(el("span", "glyph", GLYPH[c.mod]), el("span", "name", MOD_NAME[c.mod]));
  } else {
    k.append(el("span", "leg", c.label));
  }
  kb.append(k);
}

const drawn = new Set(caps.map((c) => c.id));
const offBoard = R.binds.filter((b) => !drawn.has(b.key));
if (offBoard.length) {
  const row = el("div");
  row.id = "other";
  row.append(el("span", "other-label", "Other keys"));
  for (const b of offBoard) {
    const chip = el("span", "chip", chord(b));
    chip.dataset.b = b.i;
    chip.style.setProperty("--c", color(b.group));
    row.append(chip);
  }
  kb.after(row);
}

for (const g of R.groups) {
  const li = el("li");
  const sw = el("span", "sw");
  sw.style.setProperty("--c", color(g.id));
  li.append(sw, g.label);
  $("legend").append(li);
}

// Shrinks overflowing legends; all segments of a key share one size per line so a split stays aligned.
// Modifiers that would shrink below legibility are stacked instead.
function fit() {
  const text = document.createRange();
  const ratioOf = (e) => {
    text.selectNodeContents(e);
    return (e.getBoundingClientRect().width - 1) / text.getBoundingClientRect().width;
  };
  const u = kb.getBoundingClientRect().width / 18;
  for (const k of kb.children) {
    k.classList.remove("stack");
    for (const sel of [".mods", ".leg"]) {
      const els = [...k.querySelectorAll(sel)];
      els.forEach((e) => (e.style.fontSize = ""));
      const ratio = Math.min(1, ...els.map(ratioOf));
      if (ratio < 1) {
        const px = parseFloat(getComputedStyle(els[0]).fontSize) * ratio;
        if (sel === ".mods" && px < u * 0.13 && !k.classList.contains("short")) k.classList.add("stack");
        else els.forEach((e) => (e.style.fontSize = px + "px"));
      }
    }
  }
}
fit();
addEventListener("resize", fit);

// --- preview ------------------------------------------------------------------
// A preview loops: the scene fades in, holds, acts out the key, holds the
// result and fades out. BEAT marks those points as fractions of LOOP.
const LOOP = 3400;
const BEAT = { shown: 0.06, act: 0.28, done: 0.58, fade: 0.9 };
const MID = (BEAT.act + BEAT.done) / 2;
const EASE = "cubic-bezier(0.45, 0, 0.2, 1)";
const STAGE = { w: 290, h: 150 };
const NUDGE = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] };
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
let playing = [];

// Renders a binding's preview (see preview.lua for its fields) into the tooltip.
function preview(p) {
  for (const a of playing) a.cancel();
  playing = [];
  const box = $("tip-preview");
  box.replaceChildren();
  $("tip-note").textContent = p?.note || "";
  if (!p) return;

  const scale = Math.min(STAGE.w / p.view.w, STAGE.h / p.view.h);
  // In px; windows are inset by 1px so the gaps between them stay visible.
  const px = (r, inset = 0) => ({
    x: (r.x - p.view.x) * scale + inset,
    y: (r.y - p.view.y) * scale + inset,
    w: Math.max(r.w * scale - 2 * inset, 2),
    h: Math.max(r.h * scale - 2 * inset, 2),
  });
  const css = (b, dx = 0, dy = 0) => ({ left: `${b.x + dx}px`, top: `${b.y + dy}px`, width: `${b.w}px`, height: `${b.h}px` });
  const play = (node, keyframes) =>
    playing.push(node.animate(keyframes, { duration: LOOP, iterations: Infinity, fill: "both" }));
  // Holds `a` until `start`, then eases to `b` by BEAT.done, passing `via` at MID.
  const track = (a, b, via, start = BEAT.act) => [
    { offset: 0, ...a },
    { offset: start, ...a, easing: EASE },
    ...(via ? [{ offset: MID, ...via, easing: EASE }] : []),
    { offset: BEAT.done, ...b },
    { offset: 1, ...b },
  ];
  // Pushes towards a blocked direction and springs back.
  const shake = (b, dir) => {
    const [x, y] = NUDGE[dir];
    const at = (offset, d) => ({ offset, ...css(b, x * d, y * d), easing: "ease-in-out" });
    return [at(0, 0), at(BEAT.act, 0), at(BEAT.act + 0.05, 5), at(BEAT.act + 0.1, 0), at(BEAT.act + 0.14, 2), at(BEAT.act + 0.18, 0), at(1, 0)];
  };

  const stage = el("div", "stage");
  Object.assign(stage.style, { width: `${p.view.w * scale}px`, height: `${p.view.h * scale}px` });
  const world = el("div", "world");
  stage.append(world);
  for (const d of p.desktops) {
    const desk = el("div", "desk");
    Object.assign(desk.style, css(px(d)));
    world.append(desk);
  }
  if (p.pan) {
    const to = `translate(${-p.pan.x * scale}px, ${-p.pan.y * scale}px)`;
    play(world, track({ transform: "none" }, { transform: to }, { transform: to }));
  }

  const focused = (i, phase) => p.focus?.[phase] === i + 1;
  const floats = (w, phase) => w.floating === "both" || w.floating === phase;
  // How a window moves: blocked, carried (via), or from one frame to the next;
  // with a pan, windows that aren't carried move once the new place is in view.
  const motion = (w, i, inset) => {
    const a = px(w.from || w.to, inset), b = px(w.to || w.from, inset);
    if (p.bump?.window === i + 1) return shake(a, p.bump.dir);
    return track(css(a), css(b), w.via && css(px(w.via, inset)), p.pan && !w.via ? MID : BEAT.act);
  };
  p.windows.forEach((w, i) => {
    const win = el("div", "win"), tint = el("div", "tint");
    win.append(tint);
    play(win, motion(w, i, 1));
    const z = (phase) => (floats(w, phase) || !w.from ? 3 : 1) + (focused(i, phase) ? 1 : 0);
    play(win, track({ zIndex: z("from") }, { zIndex: z("to") }));
    play(tint, track({ opacity: focused(i, "from") ? 0.22 : 0 }, { opacity: focused(i, "to") ? 0.22 : 0 }));
    if (w.floating) {
      const lift = el("div", "lift");
      win.append(lift);
      play(lift, track({ opacity: floats(w, "from") ? 1 : 0 }, { opacity: floats(w, "to") ? 1 : 0 }));
    }
    if (!w.from) play(win, track({ opacity: 0, transform: "scale(0.9)" }, { opacity: 1, transform: "none" }));
    world.append(win);
  });

  if (p.focus) {
    const ring = el("div", "ring");
    const from = p.windows[p.focus.from - 1], to = p.windows[p.focus.to - 1];
    if (p.bump && !p.bump.window) play(ring, shake(px(from.to, 1), p.bump.dir));
    else if (p.focus.from === p.focus.to) play(ring, motion(from, p.focus.from - 1, 1));
    else play(ring, track(css(px(from.from, 1)), css(px(to.to, 1))));
    world.append(ring);
  }

  if (p.keymap) {
    const map = el("div", "minimap"), keys = el("div", "minikeys");
    for (let i = 0; i < 44; i++) keys.append(el("i"));
    map.append(keys);
    play(map, track({ opacity: 0 }, { opacity: 1 }));
    play(keys, track({ transform: "scale(0.94)" }, { transform: "none" }));
    stage.append(map);
  }
  if (p.paused) {
    const badge = el("span", "badge", "Paused");
    play(badge, track({ opacity: p.paused.from ? 1 : 0 }, { opacity: p.paused.to ? 1 : 0 }));
    stage.append(badge);
  }
  if (p.label) {
    const label = el("span", "label", p.label);
    play(label, track({ opacity: 0 }, { opacity: 1 }, null, MID));
    stage.append(label);
  }
  if (p.example) stage.append(el("span", "tag", "Example"));
  box.append(stage);

  if (p.dots) {
    const row = el("div", "dots"), STEP = 11, WIDER = 4;
    p.dots.kinds.forEach((kind, i) => {
      const dot = el("span", kind === "user" ? "dot" : "dot other");
      if (p.dots.added && i === p.dots.kinds.length - 1) play(dot, track({ transform: "scale(0)" }, { transform: "none" }, { transform: "none" }));
      row.append(dot);
    });
    const here = el("span", "dot here");
    const left = (i) => `${(i - 1) * STEP - WIDER}px`;
    play(here, track({ left: left(p.dots.from) }, { left: left(p.dots.to) }, { left: left(p.dots.to) }));
    row.append(here);
    box.append(row);
  }

  play(box, [{ offset: 0, opacity: 0 }, { offset: BEAT.shown, opacity: 1 }, { offset: BEAT.fade, opacity: 1 }, { offset: 1, opacity: 0 }]);
  if (reducedMotion.matches) {
    for (const a of playing) {
      a.pause();
      a.currentTime = LOOP * (BEAT.done + BEAT.fade) / 2;
    }
  }
}

// --- tooltip ------------------------------------------------------------------
let current = null, hideTimer = 0;

function show(target) {
  clearTimeout(hideTimer);
  if (target === current) return;
  current = target;
  const b = R.binds[target.dataset.b];
  $("tip-chord").textContent = chord(b);
  $("tip-group").textContent = groupLabel.get(b.group) || "";
  $("tip-desc").textContent = b.desc;
  tip.style.setProperty("--c", color(b.group));
  preview(b.preview);
  kb.style.setProperty("--lit", color(b.group));
  for (const m of kb.querySelectorAll("[data-mod]")) m.classList.toggle("lit", b.mods.includes(m.dataset.mod));

  const r = target.getBoundingClientRect(), p = panel.getBoundingClientRect(), t = tip.getBoundingClientRect();
  const x = Math.max(p.left + 8, Math.min(r.left + r.width / 2 - t.width / 2, p.right - 8 - t.width));
  const above = r.top - t.height - 8, below = r.bottom + 8;
  // Below for the bottom key row and the chips, so the tooltip doesn't cover the modifier keys it lights.
  let y = r.bottom > kb.getBoundingClientRect().bottom - 8 ? below : above;
  if (y < 8) y = below;
  else if (y + t.height > innerHeight - 8) y = above;
  tip.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
  tip.classList.add("on");
}

function hide() {
  current = null;
  tip.classList.remove("on");
  preview(null);
  for (const m of kb.querySelectorAll(".lit")) m.classList.remove("lit");
}

// pointerover fires on the segment being entered, so moving between segments swaps content without hiding;
// the short delay bridges the gaps between keys.
document.addEventListener("pointerover", (e) => {
  const target = e.target.closest("[data-b]");
  if (target) show(target);
  else {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(hide, 90);
  }
});

// --- closing ------------------------------------------------------------------
const close = () => window.webkit?.messageHandlers?.retile?.postMessage({ type: "close" });
addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.preventDefault(); close(); }
});
document.addEventListener("click", (e) => {
  if (!panel.contains(e.target)) close();
});
</script>
